name: AI 抓賽程

on:
  schedule:
    # 每週一 01:23 UTC = 台北時間 09:23。
    # 刻意避開整點：GitHub 的排程在整點最塞，2026-09-14 那次排 01:00 結果 05:52 才跑（晚了近 5 小時）。
    - cron: "23 1 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "試跑（只印結果，不寫入 Sheet）"
        type: boolean
        default: true
      update_dates:
        description: "改期時自動更新既有列的日期（不勾＝只在 log 通知）"
        type: boolean
        default: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 45 # 額度大了之後詳情頁會抓比較多，但不該超過這個；超過代表卡住了
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 安裝套件
        run: npm ci
        working-directory: scraper

      - name: 純邏輯測試
        run: node test.mjs
        working-directory: scraper

      - name: 執行爬蟲
        run: node index.mjs
        working-directory: scraper
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
          SHEET_TAB: ${{ secrets.SHEET_TAB }}
          # 模型與額度參數放 repository variables（Settings → Secrets and variables → Actions → Variables），
          # 不是 secrets：這些不是機密，放 variables 才會顯示在 log 裡、也能在 GitHub 網頁上直接改。
          # 沒設的話程式用預設值（gemini-3.6-flash / 每日 20 / 詳情頁 20）。
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          GEMINI_DAILY_LIMIT: ${{ vars.GEMINI_DAILY_LIMIT }}
          MAX_DETAIL_CALLS: ${{ vars.MAX_DETAIL_CALLS }}
          DRY_RUN: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && '1' || '0' }}
          # 排程執行一律開啟改期自動更新；手動觸發時看上面的勾選。
          # 要關掉排程的自動更新，把下面的 'workflow_dispatch' 判斷式整段換成 '0' 即可。
          UPDATE_DATES: ${{ (github.event_name != 'workflow_dispatch' || inputs.update_dates) && '1' || '0' }}
